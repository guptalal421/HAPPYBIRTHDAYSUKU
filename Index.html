<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Birthday Suku ❤️</title>

<style>
body{
margin:0;
padding:0;
height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:linear-gradient(135deg,#ff9ec4,#ffc3e6,#ffd6f5);
font-family:Arial,sans-serif;
overflow:hidden;
}

.box{
background:rgba(255,255,255,.18);
backdrop-filter:blur(12px);
padding:30px;
border-radius:25px;
text-align:center;
color:white;
width:85%;
max-width:400px;
box-shadow:0 10px 35px rgba(0,0,0,.25);
}

h1{
font-size:28px;
}

p{
font-size:20px;
line-height:1.6;
}

button{
padding:12px 25px;
font-size:18px;
border:none;
border-radius:30px;
margin:15px;
cursor:pointer;
transition:.3s;
}

#yes{
background:#ff4d88;
color:white;
}

#no{
background:white;
color:#ff4d88;
position:absolute;
}
</style>

</head>

<body>

<div class="box">

<h1>❤️ Hey Suku ❤️</h1>

<p>
Before I wish you Happy Birthday...<br><br>


Can I borrow just 2 minutes of your beautiful day? 🥺❤️
</p>

<button id="yes">Yes ❤️</button>

<button id="no">No 🙈</button>

</div>

<script>

const no=document.getElementById("no");

document.addEventListener("mousemove",function(){

let x=Math.random()*(window.innerWidth-120);

let y=Math.random()*(window.innerHeight-60);

no.style.left=x+"px";

no.style.top=y+"px";

});

document.getElementById("yes").onclick=function(){

document.body.innerHTML=`

<div style="
min-height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:linear-gradient(135deg,#ff9ec4,#ffd6f5,#ffeaf5);
font-family:Arial,sans-serif;
padding:20px;
box-sizing:border-box;
">

<div style="
width:100%;
max-width:380px;
background:rgba(255,255,255,.18);
backdrop-filter:blur(12px);
padding:25px;
border-radius:25px;
text-align:center;
color:white;
box-shadow:0 10px 30px rgba(0,0,0,.25);
">

<h1 style="margin-top:0;">🎂 Happy Birthday Suku ❤️</h1>

<h3 style="margin-top:10px;">From Your Anu 💖</h3>

<p id="message" style="
font-size:18px;
line-height:1.8;
min-height:210px;
margin-top:20px;
"></p>

<button id="nextBtn"
onclick="nextPage()"
style="
display:none;
padding:14px 30px;
border:none;
border-radius:30px;
background:#ff4081;
color:white;
font-size:18px;
margin-top:20px;
">

Continue Our Journey ❤️

</button>

</div>

</div>

`;

const music = new Audio("song.mp3");

music.loop = true;

music.volume = 0.4;

music.play();
const text=`Today isn't just your birthday...

It's the day the world received someone who unknowingly became the reason behind so many of my smiles. ❤️

Every conversation, every laugh and every memory with you is precious to me.

This little surprise is made with lots of love...

Happy Birthday once again, Suku. 💖`;

let i=0;

const speed=40;

function type(){

if(i<text.length){

document.getElementById("message").innerHTML+=text.charAt(i);

i++;

setTimeout(type,speed);

}else{

document.getElementById("nextBtn").style.display="inline-block";

}

}

type();

}
function nextPage(){

document.body.innerHTML=`

<div style="
height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:linear-gradient(135deg,#ffe0ec,#ffd1e8);
font-family:Arial,sans-serif;
padding:15px;
box-sizing:border-box;
overflow:hidden;
">

<div style="
width:100%;
max-width:360px;
background:white;
padding:18px;
border-radius:22px;
text-align:center;
box-shadow:0 10px 25px rgba(0,0,0,.18);
">

<h2 style="
margin:0;
color:#ff4081;
font-size:24px;
">
📸 Our Beautiful Memories ❤️
</h2>

<p style="
font-size:15px;
color:#555;
line-height:1.5;
margin:12px 0 15px;
">
Every picture has a story...<br>
Every story has you...<br>
And every memory makes me smile. ❤️
</p>

<img
id="photo"
src="photo1.jpg"
style="
width:100%;
height:280px;
object-fit:cover;
border-radius:18px;
box-shadow:0 8px 20px rgba(0,0,0,.25);
">

<p id="count"
style="
margin-top:12px;
font-size:16px;
color:#ff4081;
font-weight:bold;
">
Memory 1 of 7
</p>

<div
id="buttons"
style="
display:none;
margin-top:15px;
">

<button
onclick="nextPage()"
style="
padding:12px 18px;
border:none;
border-radius:25px;
background:#666;
color:white;
font-size:16px;
margin:5px;
">

🔁 Repeat Moments

</button>

<button
onclick="page4()"
style="
padding:12px 18px;
border:none;
border-radius:25px;
background:#ff4081;
color:white;
font-size:16px;
margin:5px;
">

❤️ Continue

</button>

</div>

</div>

</div>

`;

const photos=[
"photo1.jpg",
"photo2.jpg",
"photo3.jpg",
"photo4.jpg",
"photo5.jpg",
"photo6.jpg",
"photo7.jpg"
];

let current=0;

const img=document.getElementById("photo");

const counter=document.getElementById("count");

const buttons=document.getElementById("buttons");

const slide=setInterval(function(){

current++;

if(current<photos.length){

img.src=photos[current];

counter.innerHTML="Memory "+(current+1)+" of "+photos.length;

}else{

clearInterval(slide);

counter.innerHTML="❤️ Every ending becomes a beautiful memory... Let's continue our journey. ❤️";

buttons.style.display="block";

}

},2500);

}

function page4(){

document.body.innerHTML=`

<div style="
height:100vh;
background:linear-gradient(135deg,#ffb6d9,#ffd6ea);
display:flex;
justify-content:center;
align-items:center;
font-family:Arial;
padding:20px;
overflow:auto;
">

<div style="
background:white;
padding:25px;
border-radius:25px;
max-width:420px;
text-align:center;
box-shadow:0 10px 25px rgba(0,0,0,.2);
">

<h1 style="color:#ff4081;">
💖 Dear Suku 💖
</h1>

<p style="
font-size:20px;
line-height:1.8;
color:#444;
">

There are countless reasons why you are special... ❤️<br><br>

🌸 Your smile 😊<br>
🌸 Your eyes ❤️<br>
🌸 Your kindness 🌸<br>
🌸 Your laughter 😂<br>
🌸 The way you say my name ❤️<br>
🌸 Our memories 📸<br>
🌸 Your eyes that brighten my day<br>
🌸 Your caring heart 💖<br>
🌸 Your beautiful soul<br>
🌸 The happiness you spread ☀️<br>
🌸 Simply because... you're YOU. ❤️

</p>

<br>

<button onclick="page5()" style="
padding:15px 35px;
background:#ff4081;
color:white;
border:none;
border-radius:40px;
font-size:20px;
cursor:pointer;
">

One Last Surprise 🎁

</button>

</div>

</div>

`;

}

function page5(){

document.body.innerHTML=`

<style>

body{
margin:0;
padding:20px;
background:linear-gradient(135deg,#ff4d88,#ff8ac6,#ffd6ec);
font-family:Arial,sans-serif;
overflow:auto;
display:flex;
justify-content:center;
align-items:center;
min-height:100vh;
box-sizing:border-box;
color:white;
}

.card{
width:100%;
max-width:420px;
background:rgba(255,255,255,.15);
backdrop-filter:blur(10px);
padding:25px;
border-radius:25px;
text-align:center;
box-shadow:0 10px 30px rgba(0,0,0,.3);
position:relative;
z-index:10;
box-sizing:border-box;
}

h1{
margin:0 0 15px;
font-size:30px;
}

p{
font-size:18px;
line-height:1.8;
margin:0;
word-break:break-word;
}

button{
margin-top:25px;
padding:14px 28px;
font-size:18px;
border:none;
border-radius:35px;
background:white;
color:#ff4081;
cursor:pointer;
}

.heart{
position:fixed;
top:-50px;
font-size:22px;
animation:fall 8s linear infinite;
z-index:1;
}

@keyframes fall{

0%{
transform:translateY(-100px);
}

100%{
transform:translateY(120vh);
}

}

</style>

<div class="card">

<h1>🎂 Happy Birthday Suku ❤️</h1>

<p>

Dear Suku ❤️<br><br>

No matter where life takes us, meeting you will always remain one of the most beautiful moments of my life.<br><br>

Though sometimes u become crazy on me in fighting but literally lots of love. Every laugh, every memory, every little moment with you will always stay close to my heart.<br><br>

On your birthday, I pray that your life is filled with endless happiness, success, peace and beautiful surprises. May your smile never fade and may all your dreams come true.And finally I'm Sorry Suku<br><br>

Thank you for being such a wonderful person.Shayad meri hi galti hogi once again sorry<br><br>

❤️ HAPPY BIRTHDAY MERI SUKU ❤️<br><br>

With lots of love and best wishes,<br><br>

❤️ Your Anu ❤️

</p>

<button onclick="location.reload()">
🔁 Replay Our Journey
</button>

</div>

`;

for(let i=0;i<60;i++){

let heart=document.createElement("div");

heart.className="heart";

heart.innerHTML="💖";

heart.style.left=Math.random()*100+"vw";

heart.style.animationDelay=Math.random()*8+"s";

heart.style.fontSize=(18+Math.random()*18)+"px";

document.body.appendChild(heart);

}

}
</script>

</body>
</html>
